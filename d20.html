<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>d20 判定 · 城瘾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--fg:#f4f4f6;--mut:rgba(244,244,246,.5);--line:rgba(255,255,255,.12);--accent:#ff2233;
    --display:"Bebas Neue",-apple-system,sans-serif;--cn:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  body{background:#070708;color:var(--fg);font-family:var(--cn);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}

  .site-header{position:fixed;top:0;left:0;width:100%;height:68px;z-index:99;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(7,7,8,.55);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .site-logo{font-weight:800;font-size:19px;color:#fff;text-decoration:none;letter-spacing:.12em}
  .site-nav{display:flex;gap:30px}
  .site-nav a{color:var(--mut);text-decoration:none;font-size:14px;letter-spacing:.1em;transition:color .2s}
  .site-nav a:hover{color:#fff}

  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 24px 48px;text-align:center;
    background:radial-gradient(70% 60% at 50% 42%,rgba(255,34,51,.12),transparent 60%)}
  .eyebrow{font-family:var(--display);letter-spacing:.4em;font-size:16px;color:var(--accent);margin-bottom:10px}
  h1{font-weight:800;font-size:clamp(34px,5vw,60px);line-height:1;margin-bottom:6px}
  .sub{color:var(--mut);font-size:15px;margin-bottom:28px}
  #dice{width:min(86vw,560px);height:min(64vh,520px);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;background:#070708}
  .hint{margin-top:18px;font-family:var(--display);letter-spacing:.3em;font-size:14px;color:var(--mut)}
  .back{margin-top:22px}
  .back a{color:var(--mut);text-decoration:none;font-size:13px;letter-spacing:.08em;border:1px solid var(--line);border-radius:100px;padding:8px 20px}
  .back a:hover{color:#fff}
</style>
</head>
<body>
<header class="site-header">
  <a class="site-logo" href="./apechain-home.html">城瘾</a>
  <nav class="site-nav">
    <a href="./apechain-home.html">探索</a>
    <a href="./ip.html">IP</a>
    <a href="./build.html">构建</a>
    <a href="./about.html">联系我们</a>
  </nav>
</header>

<main class="stage">
  <p class="eyebrow">GAME · 判定</p>
  <h1>d20 判定</h1>
  <p class="sub">城市任务里的一次掷骰——点击骰子,看命运怎么落点。</p>
  <div id="dice" aria-label="d20 掷骰子游戏"></div>
  <p class="hint">CLICK TO ROLL</p>
  <p class="back"><a href="./apechain.html">← 返回应用列表</a></p>
</main>

<script type="module">
  import { mount } from './src/games/d20/index.js';
  mount(document.getElementById('dice'));
</script>
</body>
</html>
