<script>
(function() {
  const header = document.getElementById('mainHeader');
  if (!header) return;

  let lastScrollY = 0;
  let ticking = false;

  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        const currentScrollY = window.scrollY;

        if (currentScrollY > 100) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }

        if (currentScrollY > lastScrollY && currentScrollY > 200) {
          header.classList.add('hidden-header');
          header.classList.remove('show-header');
        } else if (currentScrollY < lastScrollY && currentScrollY > 200) {
          header.classList.remove('hidden-header');
          header.classList.add('show-header');
        } else if (currentScrollY <= 200) {
          header.classList.remove('hidden-header');
          header.classList.remove('show-header');
        }

        lastScrollY = currentScrollY;
        ticking = false;
      });
      ticking = true;
    }
  });

  // Nav button click handlers
  const navButtons = document.querySelectorAll('.Header-nav button');
  navButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      const nav = this.dataset.nav;
      navButtons.forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      // Navigate based on button
      switch(nav) {
        case 'explore':
          window.location.href = '/index.html';
          break;
        case 'build':
          window.location.href = '/apechain.html';
          break;
        case 'learn':
        case 'bridge':
          // Placeholder for future pages
          console.log('Navigate to:', nav);
          break;
      }
    });
  });
})();
</script>

// ─── Category counts ───
const CATEGORIES = [
  { name: "全部", key: null },
  { name: "游戏", key: "游戏" },
  { name: "剧情插件", key: "剧情插件" },
  { name: "交互插件", key: "交互插件" },
  { name: "AI插件", key: "AI插件" },
  { name: "成就激励", key: "成就激励" }
];

function countCategory(key) {
  if (!key) return APPS.length;
  return APPS.filter(a => a.category.includes(key)).length;
}

// ─── Render filters ───
function renderFilters() {
  const el = document.getElementById('filterList');
  el.innerHTML = CATEGORIES.map((cat, i) => {
    const count = countCategory(cat.key);
    const active = i === 0 ? 'active' : '';
    return `
      <label class="FilterItem ${active}" data-filter="${cat.key || 'all'}">
        <input type="checkbox" ${i === 0 ? 'checked' : ''} />
        <span class="FilterItem-name">${cat.name}</span>
        <span class="FilterItem-count">${count}</span>
      </label>
    `;
  }).join('');

  el.addEventListener('click', (e) => {
    // Ignore clicks on the checkbox itself to prevent double-fire from <label> default behavior
    if (e.target.tagName === 'INPUT') return;
    const label = e.target.closest('.FilterItem');
    if (!label) return;

    // Toggle
    if (label.dataset.filter === 'all') {
      // "All" activates only itself
      el.querySelectorAll('.FilterItem').forEach(l => l.classList.remove('active'));
      label.classList.add('active');
      label.querySelector('input[type="checkbox"]').checked = true;
    } else {
      // Toggle this filter
      label.classList.toggle('active');
      const cb = label.querySelector('input[type="checkbox"]');
      cb.checked = label.classList.contains('active');

      // If no category filter is active, activate "All"
      const anyActive = el.querySelectorAll('.FilterItem[data-filter]:not([data-filter="all"]).active').length > 0;
      const allItem = el.querySelector('[data-filter="all"]');
      allItem.classList.toggle('active', !anyActive);
      allItem.querySelector('input[type="checkbox"]').checked = !anyActive;
    }
    renderGrid();
  });
}

// ─── Render grid ───
function renderGrid() {
  const grid = document.getElementById('appGrid');

  // Get active filters
  const activeFilters = [];
  document.querySelectorAll('.FilterItem.active[data-filter]:not([data-filter="all"])').forEach(l => {
    activeFilters.push(l.dataset.filter);
  });
  const showAll = activeFilters.length === 0;

  // Get sort
  const sortVal = document.getElementById('sortSelect').value;

  // Filter
  let filtered = showAll
    ? [...APPS]
    : APPS.filter(a => activeFilters.some(f => a.category.includes(f)));

  // Sort
  if (sortVal === 'alpha-asc') {
    filtered.sort((a, b) => a.title.localeCompare(b.title));
  } else {
    filtered.sort((a, b) => b.title.localeCompare(a.title));
  }

  // Render
  grid.innerHTML = filtered.map((app, i) => `
    <div class="AppCard-wrapper"><a href="${app.link || 'deploy.html?id=' + i}" class="AppCard" style="transition-delay: ${i * 30}ms">
      <div class="AppCard-preview">
        <img src="${app.img}" alt="${app.title}" loading="lazy" />
        <div class="AppCard-category">
          <span class="AppCard-pill">${app.category.split(',')[0]}</span>
        </div>
        <!-- frame glow -->
        <div class="AppCard-frame">
          <svg viewBox="0 0 373 220" fill="none">
            <defs>
              <linearGradient id="g${i}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="10%" stop-color="#A281FF"/>
                <stop offset="33%" stop-color="#EB8280"/>
                <stop offset="66%" stop-color="#EBBF9A"/>
                <stop offset="90%" stop-color="#89D0FF"/>
              </linearGradient>
            </defs>
            <rect x="16" y="16" width="341" height="188" rx="8" stroke="url(#g${i})" stroke-width="2" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="AppCard-content">
        <div class="AppCard-content-inner">
          <div class="AppCard-name">${app.title}</div>
          ${app.desc ? `<div class="AppCard-desc">${app.desc}</div>` : ''}
        </div>
      </div>
    </a></div>
  `).join('');

  // Trigger scroll reveal
  observeCards();
}

// ─── Scroll reveal ───
function observeCards() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px 60px 0px' });

  document.querySelectorAll('.AppCard:not(.visible)').forEach(el => observer.observe(el));
}

// ─── Sort init ───
document.getElementById('sortSelect').addEventListener('change', function() {
  const txt = this.options[this.selectedIndex].text;
  document.getElementById('sortDisplay').textContent = txt;
  renderGrid();
});

// ─── Search ───
document.querySelector('.SearchBox input').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  document.querySelectorAll('.AppCard').forEach(card => {
    const name = card.querySelector('.AppCard-name').textContent.toLowerCase();
    card.style.display = name.includes(q) ? '' : 'none';
  });
});
