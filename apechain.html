<head>

  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <style>
    /* ===== Reset & Base ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      font-size: 16px; line-height: 24px;
      background: #000; color: #fff;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    img { display: block; max-width: 100%; }

    /* ===== Utility ===== */
    .font-mono { font-family: 'DM Mono', monospace; }
    .font-sans  { font-family: 'DM Sans', system-ui, sans-serif; }
    .uppercase { text-transform: uppercase; }
    .text-12 { font-size: 12px; }
    .text-26 { font-size: 26px; }
    .text-32 { font-size: 32px; }
    .text-48 { font-size: 48px; }
    .leading-none { line-height: 1; }
    .tracking-wide { letter-spacing: 0.05em; }
    .tracking-widest { letter-spacing: 0.1em; }

    /* ===== Layout ===== */
    .page-wrap { min-height: 100vh; }

    /* ── Grid system ── */
    .grid { display: grid; }
    .grid-cols-6  { grid-template-columns: repeat(6, 1fr); }
    .grid-cols-12 { grid-template-columns: repeat(12, 1fr); }
    .grid-cols-8  { grid-template-columns: repeat(8, 1fr); }
    .gap-x-12 { column-gap: 12px; }
    .gap-x-24 { column-gap: 24px; }
    .gap-y-16 { row-gap: 16px; }
    .gap-y-60 { row-gap: 60px; }

    .col-span-6  { grid-column: span 6; }
    .col-span-4  { grid-column: span 4; }
    .col-span-8  { grid-column: span 8; }
    .col-span-3  { grid-column: span 3; }

    .px-container { padding-left: 24px; padding-right: 24px; }
    @media (min-width: 768px) {
      .md\\:grid-cols-12 { grid-template-columns: repeat(12, 1fr); }
      .md\\:grid-cols-8  { grid-template-columns: repeat(8, 1fr); }
      .md\\:col-span-4   { grid-column: span 4; }
      .md\\:col-span-8   { grid-column: span 8; }
      .md\\:col-span-3   { grid-column: span 3; }
      .md\\:col-span-9   { grid-column: span 9; }
      .md\\:gap-x-12     { column-gap: 12px; }
      .md\\:gap-x-48     { column-gap: 48px; }
      .md\\:gap-y-60     { row-gap: 60px; }
      .md\\:px-33        { padding-left: 33.6px; padding-right: 33.6px; }
    }
    @media (min-width: 1024px) {
      .lg\\:col-span-3   { grid-column: span 3; }
      .lg\\:col-span-9   { grid-column: span 9; }
    }

    /* ===== Header ===== */
    .Header {
      position: fixed; left: 0; top: 0; z-index: 99;
      display: flex; width: 100%; height: 100px;
      align-items: center; justify-content: center;
      padding: 0 24px;
      background: transparent;
    }
    .Header-inner {
      display: flex; align-items: center; justify-content: center;
      width: 100%; position: relative;
    }
    .Header-logo {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
    }
    .Header-logo svg { display: block; fill: #fff; }
    .Header-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 48px;
    }
    .Header-nav button, .Header-nav a {
      background: none; border: none; color: #fff; cursor: pointer;
      text-decoration: none;
      opacity: 0.6; transition: opacity 0.3s;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 16px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.02em;
    }
    .Header-nav button:hover,
    .Header-nav button:focus { opacity: 1; }

    /* ===== Main ===== */
    .main-content {
      position: relative; padding-top: 140px;
      background: #000;
    }

    /* ── Hero ── */
    .hero-section {
      padding: 40px 24px 20px;
    }
    @media (min-width: 768px) {
      .hero-section { padding: 40px 33.6px 20px; }
    }
    .hero-title {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 56px; font-weight: 700;
      line-height: 1.4; letter-spacing: 0.02em;
      color: #fff;
    }
    .hero-sub {
      font-family: 'DM Mono', monospace;
      font-size: 14px; letter-spacing: 0.05em;
      color: rgba(255,255,255,0.6);
      margin-top: 16px; line-height: 1.5;
    }

    /* ── Layout row: sidebar + grid ── */
    .layout-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px 12px;
      padding: 0 24px 80px;
    }
    @media (min-width: 768px) {
      .layout-row {
        grid-template-columns: repeat(12, 1fr);
        gap: 48px;
        padding: 0 33.6px 80px;
      }
    }

    /* ===== Sidebar ===== */
    .Sidebar { width: 100%; max-width: 233px; }
    @media (min-width: 768px) {
      .Sidebar {
        grid-column: span 4; max-width: 233px;
        padding: 0; position: static;
      }
    }
    @media (min-width: 1024px) {
      .Sidebar { grid-column: span 3; }
    }

    /* Search */
    .SearchBox {
      position: relative; margin-bottom: 32px;
    }
    .SearchBox input {
      appearance: none;
      width: 100%; height: 46px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px 36px 10px 12px;
      color: #fff;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .SearchBox input::placeholder { color: rgba(255,255,255,0.3); }
    .SearchBox input:focus { border-color: rgba(255,255,255,0.5); }
    .SearchBox svg {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* Filter list */
    .FilterList { margin-bottom: 32px; }
    .FilterItem {
      position: relative;
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      padding: 4px 0;
      transition: opacity 0.3s;
      user-select: none;
    }
    .FilterItem:not(.active) { opacity: 0.2; }
    .FilterItem:hover { opacity: 1; }
    .FilterItem.active { opacity: 1; }

    /* 复选框视觉隐藏,但保留可聚焦与键盘操作(不能用 display:none) */
    .FilterItem input[type="checkbox"] {
      position: absolute;
      width: 1px; height: 1px;
      margin: 0; padding: 0; border: 0;
      clip: rect(0 0 0 0);
      clip-path: inset(50%);
      overflow: hidden;
      white-space: nowrap;
    }
    .FilterItem:focus-within {
      opacity: 1;
      outline: 2px solid rgba(255,255,255,0.7);
      outline-offset: 4px;
      border-radius: 4px;
    }

    .FilterItem-name {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 700;
      font-size: 16px; line-height: 1.4;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .FilterItem-count {
      font-family: 'DM Mono', monospace;
      font-size: 12px; font-weight: 400;
      letter-spacing: 0.05em;
      color: #fff;
      padding-top: 4px;
      line-height: 1.4;
    }

    /* Sort */
    .SortSection { margin-top: 16px; }
    .SortLabel {
      font-family: 'DM Mono', monospace;
      font-size: 12px; font-weight: 400;
      text-transform: uppercase; letter-spacing: 0.24px;
      color: #fff; margin-bottom: 8px;
    }
    .SortSelect {
      position: relative;
    }
    .SortSelect select {
      height: 40px; border-radius: 2px;
      cursor: pointer; color: #fff;
      width: 100%;
      background: transparent;
      border: 0; padding: 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 700;
      font-size: 32px; line-height: 0.785;
      text-transform: uppercase;
      appearance: none;
      -webkit-appearance: none;
      position: relative; z-index: 2;
      opacity: 0;
    }
    .SortSelect-display {
      pointer-events: none;
      position: absolute; left: 0; top: 50%;
      transform: translateY(-50%);
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 700;
      font-size: 32px; line-height: 0.785;
      text-transform: uppercase;
      color: #fff;
      opacity: 0.2;
      z-index: 1;
      white-space: nowrap;
    }
    .SortSelect select:hover + .SortSelect-display,
    .SortSelect select:focus + .SortSelect-display { opacity: 1; }
    .SortSelect select option {
      color: #000; background: #fff;
      font-size: 12px; font-family: 'DM Mono', monospace;
    }

    /* ===== App Grid ===== */
    .AppGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px 12px;
    }
    @media (min-width: 768px) {
      .AppGrid {
        grid-column: span 8;
        grid-template-columns: repeat(8, 1fr);
        gap: 60px 24px;
      }
    }
    @media (min-width: 1024px) {
      .AppGrid { grid-column: span 9; }
    }

    /* ===== Card ===== */
    .AppCard {
      display: flex; flex-direction: column;
      gap: 8px; position: relative;
    }
    @media (min-width: 768px) {
      .AppCard { gap: 24px; }
    }
    @media (min-width: 768px) {
      .AppGrid {
        grid-template-columns: repeat(8, 1fr);
        gap: 60px 24px;
      }
      .AppCard-wrapper { grid-column: span 4; }
    }
    @media (min-width: 1024px) {
      .AppGrid { grid-template-columns: repeat(9, 1fr); }
      .AppCard-wrapper { grid-column: span 3; }
    }

    .AppCard-preview {
      position: relative;
      border-radius: 8px; overflow: hidden;
      aspect-ratio: 608 / 336;
      background: rgba(255,255,255,0.05);
    }
    .AppCard-preview img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .AppCard:hover .AppCard-preview img {
      transform: scale(1.05);
    }

    /* Category pill */
    .AppCard-category {
      position: absolute; top: 12px; left: 12px; z-index: 10;
    }
    .AppCard-pill {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 12px; font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1.2px; line-height: 14px;
      color: #fff;
      background: rgba(255,255,255,0.3);
      border-radius: 8px;
      padding: 5px 8px;
      backdrop-filter: blur(4px);
    }

    /* 「即将上线」标注 —— 占位素材项不能让访客误认为是已上线成品 */
    .AppCard-status {
      position: absolute; top: 12px; right: 12px; z-index: 10;
      font-family: 'DM Mono', monospace;
      font-size: 12px; font-weight: 500;
      letter-spacing: 1.2px; line-height: 14px;
      color: #0b0b0f;
      background: rgba(255,255,255,0.82);
      border-radius: 8px;
      padding: 5px 8px;
      backdrop-filter: blur(4px);
    }
    .AppCard.is-soon .AppCard-preview img { opacity: 0.55; }

    /* 无匹配结果提示 */
    .AppGrid-empty {
      grid-column: 1 / -1;
      padding: 48px 0;
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 16px; line-height: 1.6;
      color: rgba(255,255,255,0.6);
    }

    /* Card frame glow (SVG gradient border) */
    .AppCard-frame {
      position: absolute; top: -16px; left: -16px;
      pointer-events: none;
      width: calc(100% + 32px); height: calc(100% + 32px);
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .AppCard-frame svg {
      width: 100%; height: 100%;
      display: block;
    }
    .AppCard:hover .AppCard-frame { opacity: 1; }

    /* Card content */
    .AppCard-content {
      display: flex; flex-direction: column;
      justify-content: flex-end;
    }
    .AppCard-content-inner {
      display: flex; flex-direction: column; gap: 8px;
    }
    .AppCard-name {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-weight: 700;
      font-size: 24px; line-height: 1.3;
      letter-spacing: 0.02em;
      color: #fff;
    }
    @media (min-width: 768px) {
      .AppCard-name { font-size: 28px; line-height: 1.35; }
    }
    .AppCard-desc {
      font-family: 'DM Mono', monospace;
      font-size: 12px; line-height: 1.4;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.75);
    }

    /* ===== Footer ===== */
    .Footer {
      position: relative; color: #fff;
      padding: 80px 0 0;
    }
    .Footer-bg {
      position: absolute; inset: 0; z-index: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .Footer-inner {
      position: relative; z-index: 1;
      display: flex; flex-direction: column; gap: 24px;
      padding: 48px 24px 32px;
    }
    @media (min-width: 768px) {
      .Footer-inner {
        flex-direction: row; gap: 24px;
        padding: 80px 32px 18px;
        justify-content: flex-end;
      }
    }

    .Footer-col {
      min-width: 0;
    }
    @media (min-width: 768px) {
      .Footer-col { width: calc(100% / 6 * 2); }
    }
    .Footer-col h4 {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 26px; font-weight: 400;
      text-transform: uppercase; line-height: 1;
      color: #fff; margin-bottom: 22px;
    }
    .Footer-col ul { display: flex; flex-direction: column; gap: 8px; }
    @media (min-width: 768px) {
      .Footer-col ul { gap: 16px; }
    }
    .Footer-col a {
      font-family: 'DM Mono', monospace;
      font-size: 12px; line-height: 14px;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #fff; display: inline-block;
      transition: opacity 0.2s;
    }
    .Footer-col a:hover { opacity: 0.7; }

    .Footer-bottom {
      position: relative; z-index: 1;
      padding: 32px 24px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .Footer-bottom-inner {
      display: flex; flex-direction: column; gap: 8px;
      font-family: 'DM Mono', monospace;
      font-size: 12px; color: rgba(255,255,255,0.5);
    }
    .Footer-bottom-inner a { color: rgba(255,255,255,0.5); }
    .Footer-bottom-inner a:hover { color: #fff; }
    @media (min-width: 768px) {
      .Footer-bottom-inner { flex-direction: row; gap: 24px; }
    }

    /* ===== Animations ===== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .anim-fade-up {
      opacity: 0;
      animation: fadeUp 0.6s ease forwards;
    }
    .anim-delay-1 { animation-delay: 0.1s; }
    .anim-delay-2 { animation-delay: 0.2s; }
    .anim-delay-3 { animation-delay: 0.3s; }
    .anim-delay-4 { animation-delay: 0.4s; }
    .anim-delay-5 { animation-delay: 0.5s; }
    .anim-delay-6 { animation-delay: 0.6s; }

    /* Card stagger on scroll */
    .AppCard {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .AppCard.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>

</head>

<div class="page-wrap">

  <style>
  /* ===== Header ===== */
  .Header {
    position: fixed; left: 0; top: 0; z-index: 99;
    display: flex; width: 100%; height: 96px;
    align-items: center; justify-content: center;
    padding: 0 24px;
    background: transparent;
    transition: transform 0.3s ease-in-out;
  }
  @media (min-width: 768px) {
    .Header { height: 100px; }
  }
  .Header::before {
    content: "";
    pointer-events: none;
    position: absolute; inset: 0; width: 100%; height: 100%;
    background-color: #000;
    transition: transform 0.3s ease-in-out;
    transform: translateY(-100%);
  }
  .Header.scrolled::before {
    transform: translateY(0);
  }
  .Header.hidden-header {
    transform: translateY(-100%);
  }
  .Header.hidden-header::before {
    transform: translateY(0);
  }
  .Header.show-header {
    transform: translateY(0);
  }

  .Header-bg-gradient {
    pointer-events: none;
    position: absolute; left: 0; right: 0; top: 0;
    height: 11.25rem;
    background: linear-gradient(to bottom, #000, transparent);
    transition: opacity 0.3s ease-in-out;
    opacity: 1;
  }
  .Header.hidden-header .Header-bg-gradient,
  .Header.scrolled .Header-bg-gradient {
    opacity: 0;
  }

  .Header-inner {
    display: flex; align-items: center; justify-content: center;
    width: 100%; position: relative; max-width: 1440px;
  }
  .Header-logo {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  }
  .Header-logo svg { display: block; }
  .Header-nav {
    display: flex; align-items: center; justify-content: center;
    gap: 48px;
  }
  .Header-nav button, .Header-nav a {
    background: none; border: none; color: #fff; cursor: pointer;
    text-decoration: none;
    opacity: 0.6; transition: opacity 0.3s;
    font-family: 'Bebas Neue', 'Oswald', sans-serif;
    font-size: 26px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.02em;
    line-height: 0.785;
  }
  .Header-nav button:hover,
  .Header-nav button.active { opacity: 1; }

  /* Hamburger */
  .hamburger-btn {
    position: absolute; top: 50%; transform: translateY(-50%);
    left: 0; z-index: 20;
    padding: 6px; transition: all 0.3s;
    background: none; border: none; color: #fff;
  }
  .hamburger-btn:hover { background: #fff; color: #000; }
  @media (min-width: 768px) { .hamburger-btn { display: none; } }

  .mobile-hidden {
    display: none;
  }
  @media (min-width: 768px) {
    .mobile-hidden { display: block; }
    .mobile-logo { display: none !important; }
  }
</style>

<script>
(function() {
  const header = document.getElementById('mainHeader');
  if (!header) return;

  let lastScrollY = 0;
  let ticking = false;

  window.addEventListener('scroll', function() {
    if (!ticking) {
      window.requestAnimationFrame(function() {
        const currentScrollY = window.scrollY;

        if (currentScrollY > 100) {
          header.classList.add('scrolled');
        } else {
          header.classList.remove('scrolled');
        }

        if (currentScrollY > lastScrollY && currentScrollY > 200) {
          header.classList.add('hidden-header');
          header.classList.remove('show-header');
        } else if (currentScrollY < lastScrollY && currentScrollY > 200) {
          header.classList.remove('hidden-header');
          header.classList.add('show-header');
        } else if (currentScrollY <= 200) {
          header.classList.remove('hidden-header');
          header.classList.remove('show-header');
        }

        lastScrollY = currentScrollY;
        ticking = false;
      });
      ticking = true;
    }
  });

  // Nav button click handlers
  const navButtons = document.querySelectorAll('.Header-nav button');
  navButtons.forEach(btn => {
    btn.addEventListener('click', function() {
      const nav = this.dataset.nav;
      navButtons.forEach(b => b.classList.remove('active'));
      this.classList.add('active');

      // Navigate based on button
      switch(nav) {
        case 'explore':
          window.location.href = '/index.html';
          break;
        case 'build':
          window.location.href = '/apechain.html';
          break;
        case 'learn':
        case 'bridge':
          // Placeholder for future pages
          console.log('Navigate to:', nav);
          break;
      }
    });
  });
})();
</script>

        <!-- Sort -->
        <div class="SortSection">
          <p class="SortLabel" id="sortLabel">排序方式</p>
          <div class="SortSelect">
            <select id="sortSelect" aria-labelledby="sortLabel">
              <option value="alpha-asc">名称 A→Z</option>
              <option value="alpha-desc">名称 Z→A</option>
            </select>
            <span class="SortSelect-display" id="sortDisplay" aria-hidden="true">名称 A→Z</span>
          </div>
        </div>
      </aside>

      <!-- App Grid -->
      <div class="AppGrid" id="appGrid" aria-live="polite"></div>

    </div>
  </main>

  <!-- ===== Footer ===== -->
  </div>

<!-- 应用目录与分类词表的唯一事实源 -->
<script src="/content.js"></script>

<script>
// ─── 数据源 ──────────────────────────────────────────────────
// 目录数据统一放在 /content.js 的 __siteContent.appCatalog,详情页 deploy.html 读同一份。
// 每条应用有稳定 slug,卡片链接按 slug 生成,不再依赖筛选排序后的数组下标。
const CATALOG = (window.__siteContent && window.__siteContent.appCatalog) || { categories: [], apps: [] };
const APPS = CATALOG.apps || [];

// 侧栏筛选项 =「全部」+ 词表里的分类;词表(含 ?f= 用的 slug)只在 content.js 里维护一份
const CATEGORIES = [{ slug: 'all', name: '全部' }].concat(CATALOG.categories || []);

// 中文标题按本地化规则(拼音)排序,而不是 Unicode 码点
const COLLATOR = (typeof Intl !== 'undefined' && Intl.Collator)
  ? new Intl.Collator('zh-Hans-CN', { numeric: true, sensitivity: 'base' })
  : { compare: function(a, b) { return a < b ? -1 : (a > b ? 1 : 0); } };

function escapeHTML(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
  });
}

function countCategory(slug) {
  if (slug === 'all') return APPS.length;
  const cat = CATEGORIES.find(c => c.slug === slug);
  if (!cat) return 0;
  return APPS.filter(a => a.category === cat.name).length;
}

// ─── URL 参数 ────────────────────────────────────────────────
// 首页的分类入口形如 ./apechain.html?f=game。未知 slug 一律忽略,降级为「全部」。
function readCategorySlugsFromURL() {
  const raw = new URLSearchParams(window.location.search).get('f');
  if (!raw) return [];
  const known = CATEGORIES.map(c => c.slug);
  return raw.split(',')
    .map(s => s.trim().toLowerCase())
    .filter(s => s && s !== 'all' && known.indexOf(s) !== -1);
}

// 把当前分类选择写回地址栏,便于分享和刷新后保持
function syncURL(slugs) {
  if (!window.history || !window.history.replaceState) return;
  const params = new URLSearchParams(window.location.search);
  if (slugs.length) params.set('f', slugs.join(','));
  else params.delete('f');
  const qs = params.toString();
  window.history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : ''));
}

// ─── Render filters ───
function setFilterChecked(label, on) {
  label.classList.toggle('active', on);
  label.querySelector('input[type="checkbox"]').checked = on;
}

function renderFilters(initialSlugs) {
  const el = document.getElementById('filterList');
  el.innerHTML = CATEGORIES.map(cat => {
    const checked = cat.slug === 'all' ? initialSlugs.length === 0 : initialSlugs.indexOf(cat.slug) !== -1;
    return `
      <label class="FilterItem ${checked ? 'active' : ''}" data-filter="${escapeHTML(cat.slug)}" data-name="${escapeHTML(cat.name)}">
        <input type="checkbox" ${checked ? 'checked' : ''} />
        <span class="FilterItem-name">${escapeHTML(cat.name)}</span>
        <span class="FilterItem-count">${countCategory(cat.slug)}</span>
      </label>
    `;
  }).join('');

  // 监听 change 而非 click:鼠标点 label 与键盘按空格都会触发,键盘用户同样可操作
  el.addEventListener('change', (e) => {
    const label = e.target.closest('.FilterItem');
    if (!label) return;

    if (label.dataset.filter === 'all') {
      // 「全部」是互斥项:选中它就清掉其它分类
      el.querySelectorAll('.FilterItem').forEach(l => setFilterChecked(l, l === label));
    } else {
      setFilterChecked(label, label.querySelector('input[type="checkbox"]').checked);
      // 一个分类都没选时自动回到「全部」
      const anyActive = el.querySelectorAll('.FilterItem.active:not([data-filter="all"])').length > 0;
      setFilterChecked(el.querySelector('[data-filter="all"]'), !anyActive);
    }
    renderGrid();
  });
}

// ─── 渲染管线 ────────────────────────────────────────────────
// 搜索、筛选、排序共用这一条管线,三者可叠加,不会互相清空。
function readState() {
  const slugs = [];
  const names = [];
  document.querySelectorAll('#filterList .FilterItem.active:not([data-filter="all"])').forEach(l => {
    slugs.push(l.dataset.filter);
    names.push(l.dataset.name);
  });
  const input = document.getElementById('searchInput');
  return {
    slugs: slugs,
    names: names,
    query: input ? input.value.trim().toLowerCase() : '',
    sort: document.getElementById('sortSelect').value
  };
}

function matchesQuery(app, query) {
  if (!query) return true;
  return (app.title + ' ' + (app.desc || '') + ' ' + app.category).toLowerCase().indexOf(query) !== -1;
}

function renderGrid() {
  const grid = document.getElementById('appGrid');
  const state = readState();

  const filtered = APPS
    .filter(a => state.names.length === 0 || state.names.indexOf(a.category) !== -1)
    .filter(a => matchesQuery(a, state.query))
    .sort((a, b) => state.sort === 'alpha-desc'
      ? COLLATOR.compare(b.title, a.title)
      : COLLATOR.compare(a.title, b.title));

  if (!APPS.length) {
    grid.innerHTML = '<p class="AppGrid-empty">应用目录加载失败,请刷新页面重试。</p>';
    return;
  }

  if (!filtered.length) {
    grid.innerHTML = '<p class="AppGrid-empty">' +
      (state.query ? '没有匹配「' + escapeHTML(state.query) + '」的应用。' : '当前筛选条件下没有应用。') +
      '换个关键词或分类试试。</p>';
    return;
  }

  grid.innerHTML = filtered.map((app, i) => {
    // 稳定链接:已上线项走自己的入口,其余走详情页的 slug 寻址
    const href = app.link || ('deploy.html?app=' + encodeURIComponent(app.slug));
    const soon = app.status === 'soon';
    return `
    <div class="AppCard-wrapper"><a href="${escapeHTML(href)}" class="AppCard${soon ? ' is-soon' : ''}" style="transition-delay: ${i * 30}ms">
      <div class="AppCard-preview">
        <img src="${escapeHTML(app.img)}" alt="${escapeHTML(app.title)}" loading="lazy" />
        <div class="AppCard-category">
          <span class="AppCard-pill">${escapeHTML(app.category)}</span>
        </div>
        ${soon ? '<span class="AppCard-status">即将上线</span>' : ''}
        <!-- frame glow -->
        <div class="AppCard-frame">
          <svg viewBox="0 0 373 220" fill="none">
            <defs>
              <linearGradient id="g-${escapeHTML(app.slug)}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="10%" stop-color="#A281FF"/>
                <stop offset="33%" stop-color="#EB8280"/>
                <stop offset="66%" stop-color="#EBBF9A"/>
                <stop offset="90%" stop-color="#89D0FF"/>
              </linearGradient>
            </defs>
            <rect x="16" y="16" width="341" height="188" rx="8" stroke="url(#g-${escapeHTML(app.slug)})" stroke-width="2" fill="none"/>
          </svg>
        </div>
      </div>
      <div class="AppCard-content">
        <div class="AppCard-content-inner">
          <div class="AppCard-name">${escapeHTML(app.title)}</div>
          ${app.desc ? `<div class="AppCard-desc">${escapeHTML(app.desc)}</div>` : ''}
        </div>
      </div>
    </a></div>
  `;
  }).join('');

  syncURL(state.slugs);

  // Trigger scroll reveal
  observeCards();
}

// ─── Scroll reveal ───
function observeCards() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        observer.unobserve(e.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px 60px 0px' });

  document.querySelectorAll('.AppCard:not(.visible)').forEach(el => observer.observe(el));
}

// ─── Sort init ───
document.getElementById('sortSelect').addEventListener('change', function() {
  document.getElementById('sortDisplay').textContent = this.options[this.selectedIndex].text;
  renderGrid();
});

// ─── Search ───
document.getElementById('searchInput').addEventListener('input', renderGrid);

// ─── Init ───
renderFilters(readCategorySlugsFromURL());
renderGrid();
</script>

  <script src="/site-shell.js" defer></script>
</body>
</html>
