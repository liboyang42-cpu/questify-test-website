<?xml version="1.0" encoding="UTF-8"?>
<!-- 预制人生章节配图占位图(F09)。
     9 张章节配图原为 images.unsplash.com 外链,已下线;在自托管素材就位前,
     presetLifeData.js 的 chapterImage() 会回落到本文件。待办清单见该文件顶部注释。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="配图待补">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f1ee"/>
      <stop offset="100%" stop-color="#d9d7d2"/>
    </linearGradient>
    <pattern id="p" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="56" height="56" fill="none"/>
      <rect width="28" height="56" fill="#000" opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1800" height="1200" fill="url(#g)"/>
  <rect width="1800" height="1200" fill="url(#p)"/>
  <g fill="#1a1a1a" opacity=".38" font-family="-apple-system,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <text x="900" y="580" font-size="72" letter-spacing="18">配图待补</text>
    <text x="900" y="660" font-size="34" letter-spacing="10" opacity=".7">IMAGE PENDING</text>
  </g>
</svg>
