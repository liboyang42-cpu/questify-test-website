<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>城瘾</title>
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── Cosmic canvas ───────────────────────────────── */
    #cosmicCanvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Nav header ──────────────────────────────────── */
    .SiteHeader {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
    }
    .SiteHeader::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      pointer-events: none;
    }
    .Header-logo {
      position: relative;
      z-index: 1;
      font-family: 'Bebas Neue', 'Oswald', sans-serif;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }
    .Header-back {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.2s;
    }
    .Header-back:hover { color: #fff; }
    .Header-back svg { width: 14px; height: 14px; }

    /* ── Page layout ─────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 100px 32px 64px;
    }
    .page-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 48px;
      align-items: center;
    }
    @media (min-width: 768px) {
      .page-inner {
        grid-template-columns: 1fr 1fr;
        gap: 80px;
      }
    }

    /* ── 3D Card ─────────────────────────────────────── */
    .card-perspective {
      perspective: 900px;
      perspective-origin: center center;
    }
    .card-tilt {
      position: relative;
      border-radius: 20px;
      transform-style: preserve-3d;
      transition: transform 0.12s ease;
      cursor: default;
    }
    .card-tilt.resetting {
      transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
    }
    /* Rainbow gradient border */
    .card-tilt::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      background: linear-gradient(135deg, #A281FF 10%, #EB8280 33%, #EBBF9A 66%, #89D0FF 90%);
      z-index: 0;
    }
    .card-img-wrap {
      position: relative;
      z-index: 1;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }
    .card-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Specular highlight that follows the mouse */
    .card-shine {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 18px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18), transparent 60%);
    }
    .card-tilt:hover .card-shine { opacity: 1; }

    /* ── App info ─────────────────────────────────────── */
    .app-info {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .app-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-eyebrow::before {
      content: "";
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #0088FF;
    }

    .app-name {
      font-family: 'Bebas Neue', 'Oswald', sans-serif;
      font-size: clamp(52px, 7vw, 96px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .app-desc {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255,255,255,0.65);
      max-width: 440px;
    }

    /* ── Action buttons ───────────────────────────────── */
    .app-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .UIBtn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: 16px;
      padding: 15px 28px;
      cursor: pointer;
      min-width: 140px;
      overflow: visible;
    }
    .UIBtn.primary {
      background: #fff;
      color: #000;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .UIBtn.primary:hover {
      background: #0088FF;
      color: #fff;
    }
    .UIBtn.secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .UIBtn.secondary:hover {
      background: #0088FF;
      color: #fff;
    }

    /* Rainbow glow border on hover */
    .UIBtn-glow {
      position: absolute;
      pointer-events: none;
      top: -3px; left: -3px;
      width: calc(100% + 6px);
      height: calc(100% + 6px);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .UIBtn-glow svg { width: 100%; height: 100%; display: block; }
    .UIBtn:hover .UIBtn-glow { opacity: 1; }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      cursor: pointer;
    }
    .btn-icon:hover {
      border-color: rgba(0,136,255,0.6);
      background: rgba(0,136,255,0.12);
      color: #fff;
    }
    .btn-icon svg { width: 17px; height: 17px; }
  </style>
</head>

    gameplay: "积累成就积分 → 进入兑换商城 → 选择奖励类型 → 完成兑换 → 获得参与凭证 → 商户使用优惠。"

  <script src="/content.js"></script>

  <script>
    // ── Populate from URL param ──────────────────────────
    (function() {
      var params = new URLSearchParams(window.location.search);
      var site = window.__siteContent && window.__siteContent.apechain;
      var featuredId = params.has('featured') ? parseInt(params.get('featured') || '0', 10) : null;
      var id = parseInt(params.get('id') || '0', 10);

      function normalizeApp(app, fallback) {
        if (!app) return null;
        var name = app.name || app.title || (fallback && fallback.name) || '城瘾应用';
        var category = app.category || (fallback && fallback.category) || '应用';
        var description = app.description || app.desc || (fallback && fallback.description) || '';
        return {
          name: name,
          category: category,
          description: description,
          image: app.thumb || app.image || app.img || (fallback && (fallback.thumb || fallback.image || fallback.img)) || '',
          color: app.color || (fallback && fallback.color) || '#0088FF',
          introduction: app.introduction || '这是一个城市应用模块，将现实地点、用户行为和记录判定连接成可持续运行的互动体验。',
          gameplay: app.gameplay || '进入应用后选择目标任务，按提示完成地点互动、内容触发或数据提交，系统会同步更新进度并展示对应奖励。'
        };
      }

      var sourceApp = null;
      var fallbackCard = null;
      if (featuredId !== null && site && site.appsData) {
        sourceApp = site.appsData[featuredId];
      } else {
        sourceApp = site && site.appsSection && site.appsSection.cards ? site.appsSection.cards[id] : null;
        fallbackCard = APPS[id];
      }

      var app = normalizeApp(sourceApp, fallbackCard);
      if (!app) return;

      document.title = app.name + ' — 城瘾';
      document.getElementById('appName').textContent = app.name;
      document.getElementById('appCategory').textContent = app.category;
      document.getElementById('appDesc').textContent = app.description;
      
      // Add introduction and gameplay
      var infoSection = document.getElementById('appInfo');
      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function(ch) {
          return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
        });
      }
      if (infoSection) {
        infoSection.innerHTML = '<h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 18px; font-weight: 600;">应用介绍</h3>' +
                                '<p style="line-height: 1.6; margin-bottom: 20px;">' + escapeHTML(app.introduction) + '</p>' +
                                '<h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 18px; font-weight: 600;">玩法说明</h3>' +
                                '<p style="line-height: 1.6;">' + escapeHTML(app.gameplay) + '</p>';
      }

      var img = document.getElementById('appImg');
      img.crossOrigin = 'anonymous';
      img.alt = app.name;
      function extractAndApplyColor() {
        try {
          var tmp = document.createElement('canvas');
          tmp.width = 80; tmp.height = 80;
          var tc = tmp.getContext('2d');
          tc.drawImage(img, 0, 0, 80, 80);
          var px = tc.getImageData(0, 0, 80, 80).data;
          // Find the most vivid (saturated + bright) pixels
          var candidates = [];
          for (var i=0; i<px.length; i+=4) {
            var r=px[i], g=px[i+1], b=px[i+2];
            var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
            var brightness=(r+g+b)/3;
            // Require meaningful brightness and color (not gray/black/white)
            if (brightness<45 || brightness>230 || mx<60 || d<30) continue;
            var sat = d/mx;
            // Score = saturation weighted by brightness (prefer visible, colorful pixels)
            var score = sat * (1 - Math.abs(brightness/255 - 0.55));
            candidates.push({r:r, g:g, b:b, s:score});
          }
          if (candidates.length===0) return;
          candidates.sort(function(a,b){return b.s-a.s;});
          var topN = Math.max(1, Math.floor(candidates.length*0.08));
          var sr=0, sg=0, sb=0;
          for (var j=0; j<topN; j++) { sr+=candidates[j].r; sg+=candidates[j].g; sb+=candidates[j].b; }
          // Normalize to guaranteed visible brightness (max channel ≥ 150)
          var ar=Math.round(sr/topN), ag=Math.round(sg/topN), ab=Math.round(sb/topN);
          var maxC = Math.max(ar, ag, ab);
          if (maxC > 0 && maxC < 150) { var f=150/maxC; ar=Math.min(255,Math.round(ar*f)); ag=Math.min(255,Math.round(ag*f)); ab=Math.min(255,Math.round(ab*f)); }
          var rgb = [ar, ag, ab];
          window.__pendingNebulaColor = rgb;
          if (window.__setNebulaColor) window.__setNebulaColor(rgb[0], rgb[1], rgb[2]);
        } catch(e) {}
      }
      img.onload = extractAndApplyColor;
      img.src = app.image || '';
      if (img.complete && img.naturalWidth > 0) extractAndApplyColor();
    })();

    // ── Cosmic starfield canvas ──────────────────────────
    (function() {
      var canvas = document.getElementById('cosmicCanvas');
      var ctx = canvas.getContext('2d');
      var W, H, stars = [], nebulas = [];
      var domR = null, domG = null, domB = null;
      window.__setNebulaColor = function(r, g, b) {
        domR = r; domG = g; domB = b;
        // Recolor a percentage of stars with the dominant color and rebuild color clouds
        if (stars.length > 0) { recolorStars(); initNebulas(); }
      };
      function initNebulas() {
        nebulas = [];
        for (var i = 0; i < 7; i++) {
          var c;
          if (domR !== null && i < 3) c = [domR, domG, domB];
          else if (domR !== null && i < 5) c = [domG, domB, domR];
          else c = [180+Math.floor(Math.random()*60), 180+Math.floor(Math.random()*60), 220+Math.floor(Math.random()*35)];
          nebulas.push({
            x: Math.random()*W, y: Math.random()*H,
            r: 40 + Math.random()*80,
            c: 'rgba('+c[0]+','+c[1]+','+c[2]+',',
            a: 0.04 + Math.random()*0.06
          });
        }
      }
      // Apply pending color extracted before this script ran
      if (window.__pendingNebulaColor) {
        var p = window.__pendingNebulaColor;
        domR = p[0]; domG = p[1]; domB = p[2];
      }

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function pickStarColor() {
        // ~20% dominant, ~10% accent, rest white/slight bluish
        if (domR !== null && Math.random() < 0.20) {
          return [domR, domG, domB];
        } else if (Math.random() < 0.10) {
          // accent: complementary-ish shift from dominant, or light purple/cyan
          if (domR !== null) {
            // rotate hue ~120° by shuffling channels
            return [domG, domB, domR];
          }
          return [180, 200, 255];
        } else {
          // White-ish with slight blue tint
          var b = 200 + Math.floor(Math.random()*55);
          return [b, b, Math.min(255, b+15)];
        }
      }

      function recolorStars() {
        stars.forEach(function(s) {
          if (s.layer === 2 || (s.layer === 1 && Math.random() < 0.5)) {
            s.color = pickStarColor();
          } else if (Math.random() < 0.15) {
            s.color = pickStarColor();
          }
        });
      }

      function initStars() {
        stars = [];
        // Far small dim stars — slow drift
        for (var i = 0; i < 320; i++) {
          stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*0.8+0.1, a: Math.random(), speed: Math.random()*0.004+0.001, layer: 0,
            vx: (Math.random()-0.5)*0.12, vy: (Math.random()-0.5)*0.08, color: pickStarColor() });
        }
        // Mid stars — medium drift
        for (var i = 0; i < 100; i++) {
          stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.2+0.5, a: Math.random(), speed: Math.random()*0.003+0.001, layer: 1,
            vx: (Math.random()-0.5)*0.22, vy: (Math.random()-0.5)*0.15, color: pickStarColor() });
        }
        // Bright foreground stars — faster drift
        for (var i = 0; i < 32; i++) {
          stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8+0.8, a: Math.random(), speed: Math.random()*0.002+0.0005, layer: 2,
            vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.28, color: pickStarColor() });
        }
        // Tiny scattered color clouds (replaces big nebulas) — small, low-opacity, distributed
        nebulas = [];
        for (var i = 0; i < 7; i++) {
          var c;
          if (domR !== null && i < 3) c = [domR, domG, domB];
          else if (domR !== null && i < 5) c = [domG, domB, domR]; // accent
          else c = [180+Math.floor(Math.random()*60), 180+Math.floor(Math.random()*60), 220+Math.floor(Math.random()*35)];
          nebulas.push({
            x: Math.random()*W, y: Math.random()*H,
            r: 40 + Math.random()*80,
            c: 'rgba('+c[0]+','+c[1]+','+c[2]+',',
            a: 0.04 + Math.random()*0.06
          });
        }
      }

      var raf;
      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Subtle deep-space background — uniform dark, faint color hint (no center halo)
        var tR = domR !== null ? Math.min(20, 4 + Math.round(domR*0.06)) : 4;
        var tG = domG !== null ? Math.min(20, 5 + Math.round(domG*0.05)) : 5;
        var tB = domB !== null ? Math.min(28, 12+ Math.round(domB*0.07)) : 12;
        ctx.fillStyle = 'rgb('+tR+','+tG+','+tB+')';
        ctx.fillRect(0, 0, W, H);

        // Small scattered color clouds (very subtle, no central halo)
        nebulas.forEach(function(n) {
          var grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
          grad.addColorStop(0, n.c + n.a + ')');
          grad.addColorStop(1, n.c + '0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
          ctx.fill();
        });

        // Stars — drift + twinkle, individual colors
        var now = Date.now() * 0.001;
        stars.forEach(function(s) {
          s.x += s.vx;
          s.y += s.vy;
          if (s.x < -5) s.x = W + 5;
          else if (s.x > W + 5) s.x = -5;
          if (s.y < -5) s.y = H + 5;
          else if (s.y > H + 5) s.y = -5;

          var twinkle = (Math.sin(now * s.speed * 60 + s.a * 20) + 1) * 0.5;
          var alpha = s.layer === 0 ? twinkle * 0.45 + 0.05
                    : s.layer === 1 ? twinkle * 0.65 + 0.15
                    : twinkle * 0.85 + 0.25;
          var c = s.color || [255,255,255];
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          ctx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha+')';
          ctx.fill();
          // Glow for brighter stars
          if (s.layer === 2) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r*2.5, 0, Math.PI*2);
            ctx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha*0.18)+')';
            ctx.fill();
          }
        });

        raf = requestAnimationFrame(draw);
      }

      resize();
      initStars();
      draw();
      window.addEventListener('resize', function() {
        resize();
        initStars();
      });
    })();

    // ── 3D card tilt interaction ─────────────────────────
    (function() {
      var card = document.getElementById('card3d');
      var shine = document.getElementById('cardShine');
      if (!card) return;

      var resetTimer;

      card.addEventListener('mousemove', function(e) {
        clearTimeout(resetTimer);
        card.classList.remove('resetting');

        var rect = card.getBoundingClientRect();
        var x = (e.clientX - rect.left) / rect.width;   // 0..1
        var y = (e.clientY - rect.top) / rect.height;   // 0..1
        var nx = x - 0.5;  // -0.5..0.5
        var ny = y - 0.5;

        // Pressed-in effect: tilt toward the mouse position
        var maxTilt = 18;
        var rx = ny * -maxTilt;   // top of mouse → card top tilts away
        var ry = nx *  maxTilt;   // right of mouse → card right tilts away

        card.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale3d(1.02,1.02,1.02)';

        // Move specular highlight to mouse position
        shine.style.backgroundImage =
          'radial-gradient(circle at ' + (x*100) + '% ' + (y*100) + '%, rgba(255,255,255,0.2), transparent 55%)';
      });

      card.addEventListener('mouseleave', function() {
        card.classList.add('resetting');
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
        shine.style.backgroundImage = '';
        resetTimer = setTimeout(function() {
          card.classList.remove('resetting');
        }, 600);
      });
    })();
  </script>
