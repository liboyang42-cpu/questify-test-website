<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>城瘾</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0b0b0f" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
  <link rel="stylesheet" href="/site-shell.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: 'DM Sans', system-ui, sans-serif;
      overflow-x: hidden;
    }

    /* ── Cosmic canvas ───────────────────────────────── */
    #cosmicCanvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── 返回链接(顶栏与页脚由共享站壳 site-shell.js 注入) ─── */
    .Header-back {
      position: relative;
      z-index: 1;
      align-self: start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.2s;
    }
    .Header-back:hover { color: #fff; }
    .Header-back svg { width: 14px; height: 14px; }

    /* 星空 canvas 是 fixed z-index:0,给共享站壳页脚一个层级避免被盖住 */
    .cy-footer { position: relative; z-index: 1; }

    /* ── Page layout ─────────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 100px 32px 64px;
    }
    .page-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr;
      gap: 48px;
      align-items: center;
    }
    @media (min-width: 768px) {
      .page-inner {
        grid-template-columns: 1fr 1fr;
        gap: 80px;
      }
    }

    /* ── 3D Card ─────────────────────────────────────── */
    .card-perspective {
      perspective: 900px;
      perspective-origin: center center;
    }
    .card-tilt {
      position: relative;
      border-radius: 20px;
      transform-style: preserve-3d;
      transition: transform 0.12s ease;
      cursor: default;
    }
    .card-tilt.resetting {
      transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
    }
    /* Rainbow gradient border */
    .card-tilt::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      background: linear-gradient(135deg, #A281FF 10%, #EB8280 33%, #EBBF9A 66%, #89D0FF 90%);
      z-index: 0;
    }
    .card-img-wrap {
      position: relative;
      z-index: 1;
      border-radius: 18px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
    }
    .card-img-wrap img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    /* Specular highlight that follows the mouse */
    .card-shine {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 18px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.18), transparent 60%);
    }
    .card-tilt:hover .card-shine { opacity: 1; }

    /* ── App info ─────────────────────────────────────── */
    .app-info {
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .app-eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-eyebrow::before {
      content: "";
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #0088FF;
    }

    .app-name {
      font-family: 'Bebas Neue', 'Oswald', sans-serif;
      font-size: clamp(52px, 7vw, 96px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: 0.01em;
      text-transform: uppercase;
    }

    .app-desc {
      font-family: 'DM Sans', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.65;
      color: rgba(255,255,255,0.65);
      max-width: 440px;
    }

    /* ── Action buttons ───────────────────────────────── */
    .app-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .UIBtn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border: none;
      border-radius: 16px;
      padding: 15px 28px;
      cursor: pointer;
      min-width: 140px;
      overflow: visible;
    }
    .UIBtn.primary {
      background: #fff;
      color: #000;
      transition: background 0.25s ease, color 0.25s ease;
    }
    .UIBtn.primary:hover {
      background: #0088FF;
      color: #fff;
    }
    .UIBtn.secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      transition: background 0.25s ease, color 0.25s ease;
    }
    .UIBtn.secondary:hover {
      background: #0088FF;
      color: #fff;
    }

    .btn-icon-hint {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.55);
    }

    /* 「即将上线」徽标 —— 占位素材项在详情页也要显式标注 */
    .app-badge {
      position: absolute;
      top: 14px; right: 14px;
      z-index: 3;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
      color: #0b0b0f;
      background: rgba(255,255,255,0.85);
      border-radius: 8px;
      padding: 5px 9px;
      backdrop-filter: blur(4px);
    }

    /* 没有可用入口时的按钮:不可点击、不可聚焦 */
    .UIBtn.is-disabled {
      background: rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.5);
      cursor: default;
    }
    .UIBtn.is-disabled:hover { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.5); }
    .UIBtn.is-disabled .UIBtn-glow { display: none; }

    /* Rainbow glow border on hover */
    .UIBtn-glow {
      position: absolute;
      pointer-events: none;
      top: -3px; left: -3px;
      width: calc(100% + 6px);
      height: calc(100% + 6px);
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    .UIBtn-glow svg { width: 100%; height: 100%; display: block; }
    .UIBtn:hover .UIBtn-glow { opacity: 1; }

    .btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      transition: border-color 0.2s, background 0.2s, color 0.2s;
      cursor: pointer;
    }
    .btn-icon:hover {
      border-color: rgba(0,136,255,0.6);
      background: rgba(0,136,255,0.12);
      color: #fff;
    }
    .btn-icon svg { width: 17px; height: 17px; }
  </style>
</head>
<body>

  <canvas id="cosmicCanvas"></canvas>

  <main class="page">
    <div class="page-inner">

      <!-- Card with 3D tilt -->
      <div class="card-perspective">
        <div class="card-tilt" id="card3d">
          <div class="card-img-wrap">
            <img id="appImg" src="" alt="" />
            <span class="app-badge" id="appBadge" hidden></span>
            <div class="card-shine" id="cardShine"></div>
          </div>
        </div>
      </div>

      <!-- App info（内容由下方脚本按 ?app=<slug> 填充） -->
      <div class="app-info">
        <a class="Header-back" href="apechain.html">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
            <path d="M9 2.5L4.5 7 9 11.5"/>
          </svg>
          返回应用列表
        </a>
        <div class="app-eyebrow" id="appCategory">应用</div>
        <h1 class="app-name" id="appName">城瘾应用</h1>
        <p class="app-desc" id="appDesc"></p>

        <!-- App info details -->
        <div id="appInfo" style="margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.1); font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.85);"></div>

        <div class="app-actions" id="appActions">
          <!-- Launch button -->
          <a class="UIBtn primary" id="appLaunchBtn">
            <span class="UIBtn-glow">
              <svg viewBox="0 0 196 78" preserveAspectRatio="none">
                <defs>
                  <filter id="dg1"><feGaussianBlur stdDeviation="2"/></filter>
                  <filter id="dg2">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
                    <feFlood flood-color="white" flood-opacity="0.4"/>
                    <feComposite operator="in" in2="SourceAlpha"/>
                    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                  <linearGradient id="dgrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="10%"  stop-color="#A281FF"/>
                    <stop offset="33%"  stop-color="#EB8280"/>
                    <stop offset="66%"  stop-color="#EBBF9A"/>
                    <stop offset="90%"  stop-color="#89D0FF"/>
                  </linearGradient>
                </defs>
                <rect x="0" y="0" width="196" height="78" rx="16" fill="none" stroke="url(#dgrad)" stroke-width="1" filter="url(#dg1)"/>
                <rect x="0" y="0" width="196" height="78" rx="16" fill="none" stroke="url(#dgrad)" stroke-width="1" filter="url(#dg2)"/>
                <rect x="0" y="0" width="196" height="78" rx="16" fill="none" stroke="url(#dgrad)" stroke-width="1.5"/>
              </svg>
            </span>
            <span id="appLaunchLabel">立即体验</span>
          </a>

          <!-- Share icon -->
          <button class="btn-icon" id="appCopyBtn" type="button" title="复制本页链接" aria-label="复制本页链接">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
              <path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/>
            </svg>
          </button>
          <span class="btn-icon-hint" id="appCopyHint" role="status" aria-live="polite"></span>

          <!-- X/Twitter icon -->
          <a class="btn-icon" id="appShareX" href="https://x.com" target="_blank" rel="noopener" title="分享到 X" aria-label="分享到 X">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.259 5.63 5.905-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
          </a>
        </div>
      </div>

    </div>
  </main>

  <!-- Load content data -->
  <script src="/content.js"></script>

  <script>
    // ── 按稳定 slug 取应用 ────────────────────────────────
    // 目录数据来自 /content.js 的 __siteContent.appCatalog,与列表页 apechain.html 共用同一份。
    // 地址形如 deploy.html?app=ar-scan;slug 缺失或查不到时给出明确的「未找到」态,
    // 不再静默保留页面上的占位文案。
    (function() {
      var params = new URLSearchParams(window.location.search);
      var catalog = (window.__siteContent && window.__siteContent.appCatalog) || {};
      var apps = catalog.apps || [];
      var slug = (params.get('app') || '').trim();

      var app = null;
      for (var k = 0; k < apps.length; k++) {
        if (apps[k].slug === slug) { app = apps[k]; break; }
      }

      var elName = document.getElementById('appName');
      var elCategory = document.getElementById('appCategory');
      var elDesc = document.getElementById('appDesc');
      var elInfo = document.getElementById('appInfo');
      var elActions = document.getElementById('appActions');
      var elLaunch = document.getElementById('appLaunchBtn');
      var elLaunchLabel = document.getElementById('appLaunchLabel');
      var elBadge = document.getElementById('appBadge');
      var img = document.getElementById('appImg');

      // 转义 helper 与列表页共用,定义在 /content.js 里(单一事实源)。
      // content.js 没加载时 apps 为空,会先走下面的「未找到」分支,到不了这里。
      var escapeHTML = window.__siteEscapeHTML;

      if (!app) {
        document.title = '未找到该应用 — 城瘾';
        elCategory.textContent = '未找到';
        elName.textContent = '未找到该应用';
        elDesc.textContent = slug
          ? '地址里的应用标识「' + slug + '」不在当前应用目录中,可能已下线或链接有误。'
          : '这个地址没有指定要查看的应用。';
        elInfo.innerHTML = '<p style="line-height: 1.6;">请回到应用列表重新选择。</p>';
        if (elActions) {
          elActions.innerHTML = '<a class="UIBtn primary" href="apechain.html">返回应用列表</a>';
        }
        // 没有内容可展示时把整张卡片一起去掉,只留说明和返回入口
        var cardWrap = document.querySelector('.card-perspective');
        if (cardWrap) cardWrap.remove();
        return;
      }

      document.title = app.title + ' — 城瘾';
      elName.textContent = app.title;
      elCategory.textContent = app.category;
      elDesc.textContent = app.desc || '';

      // 占位素材项显式标注「即将上线」,避免被当成已上线成品
      var soon = app.status === 'soon';
      if (elBadge) {
        elBadge.textContent = '即将上线';
        elBadge.hidden = !soon;
      }
      if (elLaunch) {
        if (app.link) {
          elLaunch.setAttribute('href', app.link);
          elLaunch.removeAttribute('aria-disabled');
          elLaunch.classList.remove('is-disabled');
          elLaunchLabel.textContent = '立即体验';
        } else {
          // 没有可用入口就不做成假的可点击按钮:去掉 href,标注不可用
          elLaunch.removeAttribute('href');
          elLaunch.setAttribute('aria-disabled', 'true');
          elLaunch.classList.add('is-disabled');
          elLaunchLabel.textContent = soon ? '即将上线' : '暂未开放';
        }
      }

      elInfo.innerHTML = '<h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 18px; font-weight: 600;">应用介绍</h3>' +
                         '<p style="line-height: 1.6; margin-bottom: 20px;">' + escapeHTML(app.introduction) + '</p>' +
                         '<h3 style="margin-top: 24px; margin-bottom: 12px; font-size: 18px; font-weight: 600;">玩法说明</h3>' +
                         '<p style="line-height: 1.6;">' + escapeHTML(app.gameplay) + '</p>';

      img.crossOrigin = 'anonymous';
      img.alt = app.title;
      function extractAndApplyColor() {
        try {
          var tmp = document.createElement('canvas');
          tmp.width = 80; tmp.height = 80;
          var tc = tmp.getContext('2d');
          tc.drawImage(img, 0, 0, 80, 80);
          var px = tc.getImageData(0, 0, 80, 80).data;
          // Find the most vivid (saturated + bright) pixels
          var candidates = [];
          for (var i=0; i<px.length; i+=4) {
            var r=px[i], g=px[i+1], b=px[i+2];
            var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
            var brightness=(r+g+b)/3;
            // Require meaningful brightness and color (not gray/black/white)
            if (brightness<45 || brightness>230 || mx<60 || d<30) continue;
            var sat = d/mx;
            // Score = saturation weighted by brightness (prefer visible, colorful pixels)
            var score = sat * (1 - Math.abs(brightness/255 - 0.55));
            candidates.push({r:r, g:g, b:b, s:score});
          }
          if (candidates.length===0) return;
          candidates.sort(function(a,b){return b.s-a.s;});
          var topN = Math.max(1, Math.floor(candidates.length*0.08));
          var sr=0, sg=0, sb=0;
          for (var j=0; j<topN; j++) { sr+=candidates[j].r; sg+=candidates[j].g; sb+=candidates[j].b; }
          // Normalize to guaranteed visible brightness (max channel ≥ 150)
          var ar=Math.round(sr/topN), ag=Math.round(sg/topN), ab=Math.round(sb/topN);
          var maxC = Math.max(ar, ag, ab);
          if (maxC > 0 && maxC < 150) { var f=150/maxC; ar=Math.min(255,Math.round(ar*f)); ag=Math.min(255,Math.round(ag*f)); ab=Math.min(255,Math.round(ab*f)); }
          var rgb = [ar, ag, ab];
          window.__pendingNebulaColor = rgb;
          if (window.__setNebulaColor) window.__setNebulaColor(rgb[0], rgb[1], rgb[2]);
        } catch(e) {}
      }
      img.onload = extractAndApplyColor;
      img.src = app.img || '';
      if (img.complete && img.naturalWidth > 0) extractAndApplyColor();

      // 两个分享控件原本只有 title、没有行为(X 链接指向 '#'),这里接上真实动作
      var shareText = app.title + ' — 城瘾';
      var shareX = document.getElementById('appShareX');
      if (shareX) {
        shareX.setAttribute('href', 'https://x.com/intent/post?text=' +
          encodeURIComponent(shareText) + '&url=' + encodeURIComponent(location.href));
      }
      var copyBtn = document.getElementById('appCopyBtn');
      var copyHint = document.getElementById('appCopyHint');
      if (copyBtn) {
        copyBtn.addEventListener('click', function() {
          var done = function(text) {
            copyHint.textContent = text;
            setTimeout(function() { copyHint.textContent = ''; }, 2400);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(location.href)
              .then(function() { done('链接已复制'); })
              .catch(function() { done('复制失败,请手动复制地址栏链接'); });
          } else {
            done('复制失败,请手动复制地址栏链接');
          }
        });
      }
    })();

    // ── Cosmic starfield canvas ──────────────────────────
    (function() {
      var canvas = document.getElementById('cosmicCanvas');
      var ctx = canvas.getContext('2d');
      var W, H, stars = [], nebulas = [];
      var domR = null, domG = null, domB = null;
      window.__setNebulaColor = function(r, g, b) {
        domR = r; domG = g; domB = b;
        // Recolor a percentage of stars with the dominant color and rebuild color clouds
        if (stars.length > 0) { recolorStars(); initNebulas(); }
      };
      function initNebulas() {
        nebulas = [];
        for (var i = 0; i < 7; i++) {
          var c;
          if (domR !== null && i < 3) c = [domR, domG, domB];
          else if (domR !== null && i < 5) c = [domG, domB, domR];
          else c = [180+Math.floor(Math.random()*60), 180+Math.floor(Math.random()*60), 220+Math.floor(Math.random()*35)];
          nebulas.push({
            x: Math.random()*W, y: Math.random()*H,
            r: 40 + Math.random()*80,
            c: 'rgba('+c[0]+','+c[1]+','+c[2]+',',
            a: 0.04 + Math.random()*0.06
          });
        }
      }
      // Apply pending color extracted before this script ran
      if (window.__pendingNebulaColor) {
        var p = window.__pendingNebulaColor;
        domR = p[0]; domG = p[1]; domB = p[2];
      }

      function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }

      function pickStarColor() {
        // ~20% dominant, ~10% accent, rest white/slight bluish
        if (domR !== null && Math.random() < 0.20) {
          return [domR, domG, domB];
        } else if (Math.random() < 0.10) {
          // accent: complementary-ish shift from dominant, or light purple/cyan
          if (domR !== null) {
            // rotate hue ~120° by shuffling channels
            return [domG, domB, domR];
          }
          return [180, 200, 255];
        } else {
          // White-ish with slight blue tint
          var b = 200 + Math.floor(Math.random()*55);
          return [b, b, Math.min(255, b+15)];
        }
      }

      function recolorStars() {
        stars.forEach(function(s) {
          if (s.layer === 2 || (s.layer === 1 && Math.random() < 0.5)) {
            s.color = pickStarColor();
          } else if (Math.random() < 0.15) {
            s.color = pickStarColor();
          }
        });
      }

      function initStars() {
        stars = [];
        // Far small dim stars — slow drift
        for (var i = 0; i < 320; i++) {
          stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*0.8+0.1, a: Math.random(), speed: Math.random()*0.004+0.001, layer: 0,
            vx: (Math.random()-0.5)*0.12, vy: (Math.random()-0.5)*0.08, color: pickStarColor() });
        }
        // Mid stars — medium drift
        for (var i = 0; i < 100; i++) {
          stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.2+0.5, a: Math.random(), speed: Math.random()*0.003+0.001, layer: 1,
            vx: (Math.random()-0.5)*0.22, vy: (Math.random()-0.5)*0.15, color: pickStarColor() });
        }
        // Bright foreground stars — faster drift
        for (var i = 0; i < 32; i++) {
          stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8+0.8, a: Math.random(), speed: Math.random()*0.002+0.0005, layer: 2,
            vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.28, color: pickStarColor() });
        }
        // Tiny scattered color clouds (replaces big nebulas) — small, low-opacity, distributed
        nebulas = [];
        for (var i = 0; i < 7; i++) {
          var c;
          if (domR !== null && i < 3) c = [domR, domG, domB];
          else if (domR !== null && i < 5) c = [domG, domB, domR]; // accent
          else c = [180+Math.floor(Math.random()*60), 180+Math.floor(Math.random()*60), 220+Math.floor(Math.random()*35)];
          nebulas.push({
            x: Math.random()*W, y: Math.random()*H,
            r: 40 + Math.random()*80,
            c: 'rgba('+c[0]+','+c[1]+','+c[2]+',',
            a: 0.04 + Math.random()*0.06
          });
        }
      }

      var raf;
      function draw() {
        ctx.clearRect(0, 0, W, H);

        // Subtle deep-space background — uniform dark, faint color hint (no center halo)
        var tR = domR !== null ? Math.min(20, 4 + Math.round(domR*0.06)) : 4;
        var tG = domG !== null ? Math.min(20, 5 + Math.round(domG*0.05)) : 5;
        var tB = domB !== null ? Math.min(28, 12+ Math.round(domB*0.07)) : 12;
        ctx.fillStyle = 'rgb('+tR+','+tG+','+tB+')';
        ctx.fillRect(0, 0, W, H);

        // Small scattered color clouds (very subtle, no central halo)
        nebulas.forEach(function(n) {
          var grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
          grad.addColorStop(0, n.c + n.a + ')');
          grad.addColorStop(1, n.c + '0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
          ctx.fill();
        });

        // Stars — drift + twinkle, individual colors
        var now = Date.now() * 0.001;
        stars.forEach(function(s) {
          s.x += s.vx;
          s.y += s.vy;
          if (s.x < -5) s.x = W + 5;
          else if (s.x > W + 5) s.x = -5;
          if (s.y < -5) s.y = H + 5;
          else if (s.y > H + 5) s.y = -5;

          var twinkle = (Math.sin(now * s.speed * 60 + s.a * 20) + 1) * 0.5;
          var alpha = s.layer === 0 ? twinkle * 0.45 + 0.05
                    : s.layer === 1 ? twinkle * 0.65 + 0.15
                    : twinkle * 0.85 + 0.25;
          var c = s.color || [255,255,255];
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          ctx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+alpha+')';
          ctx.fill();
          // Glow for brighter stars
          if (s.layer === 2) {
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r*2.5, 0, Math.PI*2);
            ctx.fillStyle = 'rgba('+c[0]+','+c[1]+','+c[2]+','+(alpha*0.18)+')';
            ctx.fill();
          }
        });

        raf = requestAnimationFrame(draw);
      }

      resize();
      initStars();
      draw();
      window.addEventListener('resize', function() {
        resize();
        initStars();
      });
    })();

    // ── 3D card tilt interaction ─────────────────────────
    (function() {
      var card = document.getElementById('card3d');
      var shine = document.getElementById('cardShine');
      if (!card) return;

      var resetTimer;

      card.addEventListener('mousemove', function(e) {
        clearTimeout(resetTimer);
        card.classList.remove('resetting');

        var rect = card.getBoundingClientRect();
        var x = (e.clientX - rect.left) / rect.width;   // 0..1
        var y = (e.clientY - rect.top) / rect.height;   // 0..1
        var nx = x - 0.5;  // -0.5..0.5
        var ny = y - 0.5;

        // Pressed-in effect: tilt toward the mouse position
        var maxTilt = 18;
        var rx = ny * -maxTilt;   // top of mouse → card top tilts away
        var ry = nx *  maxTilt;   // right of mouse → card right tilts away

        card.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) scale3d(1.02,1.02,1.02)';

        // Move specular highlight to mouse position
        shine.style.backgroundImage =
          'radial-gradient(circle at ' + (x*100) + '% ' + (y*100) + '%, rgba(255,255,255,0.2), transparent 55%)';
      });

      card.addEventListener('mouseleave', function() {
        card.classList.add('resetting');
        card.style.transform = 'rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
        shine.style.backgroundImage = '';
        resetTimer = setTimeout(function() {
          card.classList.remove('resetting');
        }, 600);
      });
    })();
  </script>

  <script src="/site-shell.js" defer></script>
</body>
