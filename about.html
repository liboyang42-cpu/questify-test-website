<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="canonical" href="https://www.chengyinhub.com/about.html" />
<title>联系我们 · 城瘾</title>
  <meta name="description" content="联系城瘾——合作、加入与咨询入口。城市是我们的游戏主板。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="城瘾" />
  <meta property="og:title" content="联系我们 · 城瘾" />
  <meta property="og:description" content="联系城瘾——合作、加入与咨询入口。城市是我们的游戏主板。" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --fg:#eef2f6; --mut:rgba(238,242,246,.55); --line:rgba(255,255,255,.12);
    --glass:rgba(255,255,255,.05); --accent:#5be0c8;
    --display:"Bebas Neue",-apple-system,sans-serif;
    --cn:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  html{scroll-behavior:smooth}
  body{background:#020308;color:var(--fg);font-family:var(--cn);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}

  /* cosmic background — 真实旋转晨昏线地球(bloomEnvironment.js);.cosmos 为无 WebGL 时兜底 */
  .cosmos{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(60% 50% at 50% 64%,rgba(33,120,108,.5),transparent 60%),
    radial-gradient(40% 30% at 78% 12%,rgba(40,80,160,.35),transparent 60%),
    linear-gradient(180deg,#020308,#03060f 50%,#020308)}
  .bloom-bg{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%;pointer-events:none;
    filter:saturate(1.02) contrast(1.02)}
  /* 可读性遮罩:压暗四周与顶底,保证 hero 文字和玻璃表单清晰 */
  .bloom-veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:
    radial-gradient(120% 80% at 50% 38%,transparent 42%,rgba(2,3,8,.55) 100%),
    linear-gradient(180deg,rgba(2,3,8,.45),transparent 22%,transparent 68%,rgba(2,3,8,.6))}

  /* header — pill nav (activetheory 味) */
  .site-header{position:fixed;top:22px;left:0;width:100%;z-index:99;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
  .site-logo{font-family:var(--display);font-size:24px;letter-spacing:.18em;color:#fff;text-decoration:none}
  .site-nav{display:flex;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:100px;background:rgba(255,255,255,.04);backdrop-filter:blur(14px)}
  .site-nav a{color:var(--mut);text-decoration:none;font-size:13px;letter-spacing:.12em;padding:6px 16px;border-radius:100px;transition:.2s}
  .site-nav a:hover,.site-nav a[aria-current=page]{color:#02110f;background:var(--accent)}

  /* layout */
  .wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 32px}
  .hero{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .hero .eyebrow{font-family:var(--display);letter-spacing:.5em;font-size:15px;color:var(--accent);margin-bottom:18px}
  .hero h1{font-weight:800;font-size:clamp(40px,7vw,92px);line-height:1.02}
  .hero p{margin-top:22px;max-width:520px;color:var(--mut);font-size:17px;line-height:1.7}
  .hero .scroll{margin-top:54px;font-family:var(--display);letter-spacing:.4em;font-size:13px;color:var(--mut)}

  section.block{position:relative;z-index:2;padding:80px 0}
  .glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);padding:40px}
  .sec-label{font-family:var(--display);letter-spacing:.34em;color:var(--accent);font-size:15px;margin-bottom:10px}
  .sec-title{font-weight:800;font-size:clamp(26px,3.4vw,40px);margin-bottom:14px}
  .sec-sub{color:var(--mut);font-size:16px;line-height:1.7;max-width:560px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:26px}
  .card h4{font-size:19px;margin-bottom:8px}
  .card p{color:var(--mut);font-size:14px;line-height:1.6}

  /* contact form */
  .contact{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
  .contact .full{grid-column:1/-1}
  .field{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;color:var(--fg);font-family:var(--cn);font-size:15px;padding:14px 16px}
  .field::placeholder{color:rgba(238,242,246,.35)}
  select.field{appearance:none}
  textarea.field{min-height:110px;resize:vertical}
  .submit{grid-column:1/-1;justify-self:start;font-family:var(--display);letter-spacing:.2em;font-size:18px;color:#02110f;background:var(--accent);border:0;border-radius:100px;padding:14px 40px;cursor:pointer;transition:transform .2s}
  .submit:hover{transform:translateY(-2px)}
  .note{grid-column:1/-1;color:var(--mut);font-size:13px;margin-top:4px}
  .field-label{display:block;color:var(--mut);font-size:13px;letter-spacing:.06em;margin-bottom:7px}
  .field-cell.full{grid-column:1/-1}
  .field.field--error{border-color:#ff5a5a}
  .field-err{color:#ff7a7a;font-size:12px;margin-top:6px;min-height:14px}
  .consent{grid-column:1/-1;display:flex;align-items:flex-start;gap:10px;color:var(--mut);font-size:13px;line-height:1.7;cursor:pointer}
  .consent input{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--accent)}
  .consent a{color:var(--fg);text-decoration:underline}
  .form-status{grid-column:1/-1;font-size:14px;min-height:20px;margin-top:4px}
  .form-status.ok{color:var(--accent)}
  .form-status.err{color:#ff7a7a}


  /* 单屏联系页(P8):左品牌 / 右表单,桌面收敛到一个主视口 */
  .contact-screen{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:128px 32px 48px;min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;gap:52px;align-items:center}
  .contact-screen .hero{min-height:0;display:block;text-align:left;align-items:flex-start}
  .contact-screen .hero h1{font-weight:800;font-size:clamp(40px,6vw,84px);line-height:1.02;margin-top:6px}
  .contact-screen .hero .contact-lead{margin-top:22px;max-width:460px}
  .contact-screen .hero .contact-meta{margin-top:26px;font-size:13px;letter-spacing:.08em}
  .contact-card{padding:34px}
  .contact-channels{display:grid;gap:14px;margin-top:26px}
  .contact-channel{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 20px;
    color:var(--fg);text-decoration:none;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);transition:.2s}
  .contact-channel:hover{border-color:rgba(91,224,200,.55);background:rgba(91,224,200,.08);transform:translateY(-2px)}
  .contact-channel small{display:block;margin-bottom:5px;color:var(--mut);font-size:12px;letter-spacing:.1em}
  .contact-channel strong{font-size:17px;font-weight:600}
  .contact-channel span:last-child{color:var(--accent);font-size:13px;white-space:nowrap}
  .contact-channel[href] span:last-child{font-size:20px}
  .contact-operator{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1.8}
  .contact-operator a{color:inherit;text-decoration:underline}

  @media(max-width:860px){
    .contact-screen{grid-template-columns:1fr;min-height:auto;padding:104px 22px 40px;gap:28px}
    .contact-screen .hero h1{font-size:clamp(36px,11vw,60px)}
  }
  @media(max-width:720px){.contact{grid-template-columns:1fr}.site-logo{font-size:20px}}
</style>
  <link rel="stylesheet" href="/site-shell.css" />
</head>
<body>
<div class="cosmos"></div>
<canvas class="bloom-bg" id="bloom"></canvas>
<div class="bloom-veil"></div>

<main class="contact-screen">
  <section class="hero contact-intro">
    <p class="eyebrow">CONTACT · 联系我们</p>
    <h1>联系我们</h1>
    <p class="contact-lead">城瘾把真实城市变成可参与的探索体验。想加入俱乐部、与城市主题合作，或让你的门店成为路线节点——这里能找到我们。</p>
    <p class="contact-meta">城市探索 · 主题活动 · 俱乐部 · 商家合作</p>
  </section>

  <div class="glass contact-card" id="contact">
    <p class="sec-label">CONTACT · 官方联系渠道</p>
    <h2 class="sec-title">合作 · 加入 · 咨询</h2>
    <p class="sec-sub">官网暂不收集在线表单信息。你可以直接拨打客服电话，或在城瘾微信小程序内通过客服入口联系我们。</p>
    <div class="contact-channels">
      <a class="contact-channel" href="tel:15229020419">
        <span><small>客服电话</small><strong>152 2902 0419</strong></span>
        <span aria-hidden="true">→</span>
      </a>
      <div class="contact-channel">
        <span><small>微信小程序</small><strong>城瘾 · 小程序内联系客服</strong></span>
        <span>微信内搜索</span>
      </div>
    </div>
    <p class="contact-operator">运营主体：上海城瘾科技有限公司<br>域名：chein.ink<br>备案号：<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">沪ICP备2026043558号-1</a></p>
  </div>
</main>

<script type="module">
  // 真实旋转晨昏线地球(复用落地页 bloomEnvironment):自动旋转 + 晨昏线 + 云层 + 城市夜光 + 大气层
  import { setupBloomEnvironment } from './src/bloomEnvironment.js';
  import { gsap } from 'gsap';

  const canvas = document.getElementById('bloom');
  const env = setupBloomEnvironment(canvas); // 无 WebGL 时静默返回,.cosmos 渐变兜底
  env?.resume(); // 启动绘制循环(落地页由 scheduler 触发,本页直接启动)

  // 进场动画(gsap):地球淡入推近 → hero 文案依次浮现;尊重 prefers-reduced-motion
  const heroBits = ['.hero .eyebrow', '.hero h1', '.hero p', '.hero .scroll'];
  gsap.matchMedia().add({
    motion: '(prefers-reduced-motion: no-preference)',
    reduce: '(prefers-reduced-motion: reduce)'
  }, (ctx) => {
    if (ctx.conditions.reduce) {
      gsap.set([canvas, '.bloom-veil', ...heroBits], { autoAlpha: 1, clearProps: 'transform' });
      return;
    }
    gsap.set(canvas, { autoAlpha: 0, scale: 1.06, transformOrigin: '50% 55%' });
    gsap.set('.bloom-veil', { autoAlpha: 0 });
    gsap.set(heroBits, { autoAlpha: 0, y: 24 });
    gsap.timeline({ defaults: { ease: 'power3.out' } })
      .to(canvas, { autoAlpha: 1, scale: 1, duration: 1.6, ease: 'power2.out' })
      .to('.bloom-veil', { autoAlpha: 1, duration: 1.2 }, 0.1)
      .to(heroBits, { autoAlpha: 1, y: 0, duration: 0.9, stagger: 0.12 }, 0.5);
  });
</script>
  <script src="/site-shell.js" defer></script>
</body>
</html>
