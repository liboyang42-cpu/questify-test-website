<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>联系我们 · 城瘾</title>
  <meta name="description" content="联系城瘾——合作、加入与咨询入口。城市是我们的游戏主板。" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#0b0b0f" />
  <!-- 留资 API 基地址已改为构建期环境变量 VITE_LEADS_API_BASE(F01),不再用 <meta> 手填。
       构建/部署前须在 .env(或托管平台的环境变量面板)设置,例如:
         VITE_LEADS_API_BASE=https://api.example.com
       未设置时表单会自动停用并引导访客走页面上的静态联系方式,不会再静默打同源 404。 -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="城瘾" />
  <meta property="og:title" content="联系我们 · 城瘾" />
  <meta property="og:description" content="联系城瘾——合作、加入与咨询入口。城市是我们的游戏主板。" />
  <link rel="stylesheet" href="/assets/fonts/fonts.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --fg:#eef2f6; --mut:rgba(238,242,246,.55); --line:rgba(255,255,255,.12);
    --glass:rgba(255,255,255,.05); --accent:#5be0c8;
    --display:"Bebas Neue",-apple-system,sans-serif;
    --cn:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  html{scroll-behavior:smooth}
  body{background:#020308;color:var(--fg);font-family:var(--cn);-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}

  /* cosmic background — 真实旋转晨昏线地球(bloomEnvironment.js);.cosmos 为无 WebGL 时兜底 */
  .cosmos{position:fixed;inset:0;z-index:-1;background:
    radial-gradient(60% 50% at 50% 64%,rgba(33,120,108,.5),transparent 60%),
    radial-gradient(40% 30% at 78% 12%,rgba(40,80,160,.35),transparent 60%),
    linear-gradient(180deg,#020308,#03060f 50%,#020308)}
  .bloom-bg{position:fixed;inset:0;z-index:0;display:block;width:100%;height:100%;pointer-events:none;
    filter:saturate(1.02) contrast(1.02)}
  /* 可读性遮罩:压暗四周与顶底,保证 hero 文字和玻璃表单清晰 */
  .bloom-veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:
    radial-gradient(120% 80% at 50% 38%,transparent 42%,rgba(2,3,8,.55) 100%),
    linear-gradient(180deg,rgba(2,3,8,.45),transparent 22%,transparent 68%,rgba(2,3,8,.6))}

  /* header — pill nav (activetheory 味) */
  .site-header{position:fixed;top:22px;left:0;width:100%;z-index:99;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
  .site-logo{font-family:var(--display);font-size:24px;letter-spacing:.18em;color:#fff;text-decoration:none}
  .site-nav{display:flex;gap:4px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:100px;background:rgba(255,255,255,.04);backdrop-filter:blur(14px)}
  .site-nav a{color:var(--mut);text-decoration:none;font-size:13px;letter-spacing:.12em;padding:6px 16px;border-radius:100px;transition:.2s}
  .site-nav a:hover,.site-nav a[aria-current=page]{color:#02110f;background:var(--accent)}

  /* layout */
  .wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 32px}
  .hero{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .hero .eyebrow{font-family:var(--display);letter-spacing:.5em;font-size:15px;color:var(--accent);margin-bottom:18px}
  .hero h1{font-weight:800;font-size:clamp(40px,7vw,92px);line-height:1.02}
  .hero p{margin-top:22px;max-width:520px;color:var(--mut);font-size:17px;line-height:1.7}
  .hero .scroll{margin-top:54px;font-family:var(--display);letter-spacing:.4em;font-size:13px;color:var(--mut)}

  section.block{position:relative;z-index:2;padding:80px 0}
  .glass{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);padding:40px}
  .sec-label{font-family:var(--display);letter-spacing:.34em;color:var(--accent);font-size:15px;margin-bottom:10px}
  .sec-title{font-weight:800;font-size:clamp(26px,3.4vw,40px);margin-bottom:14px}
  .sec-sub{color:var(--mut);font-size:16px;line-height:1.7;max-width:560px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:26px}
  .card h4{font-size:19px;margin-bottom:8px}
  .card p{color:var(--mut);font-size:14px;line-height:1.6}

  /* contact form */
  .contact{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px}
  .contact .full{grid-column:1/-1}
  .field{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;color:var(--fg);font-family:var(--cn);font-size:15px;padding:14px 16px}
  .field::placeholder{color:rgba(238,242,246,.35)}
  select.field{appearance:none}
  textarea.field{min-height:110px;resize:vertical}
  .submit{grid-column:1/-1;justify-self:start;font-family:var(--display);letter-spacing:.2em;font-size:18px;color:#02110f;background:var(--accent);border:0;border-radius:100px;padding:14px 40px;cursor:pointer;transition:transform .2s}
  .submit:hover{transform:translateY(-2px)}
  .note{grid-column:1/-1;color:var(--mut);font-size:13px;margin-top:4px}
  .field-label{display:block;color:var(--mut);font-size:13px;letter-spacing:.06em;margin-bottom:7px}
  .field-cell.full{grid-column:1/-1}
  .field.field--error{border-color:#ff5a5a}
  .field-err{color:#ff7a7a;font-size:12px;margin-top:6px;min-height:14px}
  .consent{grid-column:1/-1;display:flex;align-items:flex-start;gap:10px;color:var(--mut);font-size:13px;line-height:1.7;cursor:pointer}
  .consent input{margin-top:3px;flex:none;width:16px;height:16px;accent-color:var(--accent)}
  .consent a{color:var(--fg);text-decoration:underline}
  .form-status{grid-column:1/-1;font-size:14px;min-height:20px;margin-top:4px}
  .form-status.ok{color:var(--accent)}
  .form-status.err{color:#ff7a7a}
  /* 表单不可用时(留资 API 未配置)整块降低存在感,把注意力交给静态兜底联系方式 */
  .contact.is-disabled{opacity:.45;pointer-events:none}

  /* 静态兜底联系方式(F01):表单挂掉时全站唯一的可触达路径,任何情况下都渲染 */
  .contact-fallback{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
  .contact-fallback h2{font-size:15px;font-weight:600;letter-spacing:.08em;margin-bottom:12px}
  .contact-fallback dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px;line-height:1.6}
  .contact-fallback dt{color:var(--mut);white-space:nowrap}
  .contact-fallback dd{margin:0;color:var(--fg);word-break:break-all}
  .contact-fallback a{color:var(--fg)}
  .contact-fallback .fallback-hint{margin-top:12px;color:var(--mut);font-size:13px;line-height:1.6}

  footer{position:relative;z-index:2;text-align:center;padding:60px 0 50px;color:var(--mut);font-size:13px;letter-spacing:.06em;border-top:1px solid var(--line);margin-top:40px}

  /* 单屏联系页(P8):左品牌 / 右表单,桌面收敛到一个主视口 */
  .contact-screen{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:128px 32px 48px;min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;gap:52px;align-items:center}
  .contact-screen .hero{min-height:0;display:block;text-align:left;align-items:flex-start}
  .contact-screen .hero h1{font-weight:800;font-size:clamp(40px,6vw,84px);line-height:1.02;margin-top:6px}
  .contact-screen .hero .contact-lead{margin-top:22px;max-width:460px}
  .contact-screen .hero .contact-meta{margin-top:26px;font-size:13px;letter-spacing:.08em}
  .contact-card{padding:34px}

  @media(max-width:860px){
    .contact-screen{grid-template-columns:1fr;min-height:auto;padding:104px 22px 40px;gap:28px}
    .contact-screen .hero h1{font-size:clamp(36px,11vw,60px)}
  }
  @media(max-width:720px){.contact{grid-template-columns:1fr}.site-logo{font-size:20px}}
</style>
  <link rel="stylesheet" href="/site-shell.css" />
</head>
<body>
<div class="cosmos"></div>
<canvas class="bloom-bg" id="bloom"></canvas>
<div class="bloom-veil"></div>

<main class="contact-screen">
  <section class="hero contact-intro">
    <p class="eyebrow">CONTACT · 联系我们</p>
    <h1>联系我们</h1>
    <p class="contact-lead">城瘾把真实城市变成可参与的游戏系统。想合作、加入俱乐部,或把你的 IP 带进城市——这里能找到我们。</p>
    <p class="contact-meta">城瘾 Questify · AI 城市游戏操作系统 · 现已在上海启动</p>

    <!-- ⚠️ 上线前必须替换:下面三行是占位符,不是真实联系方式。
         需要业务/市场同学提供真实的对外邮箱、微信号与电话,替换 TODO-CONTACT-* 后
         同时更新 mailto: 与 tel: 链接。在替换完成前,这一块仍要保留在页面上——
         它是留资 API 未配置时全站唯一的可触达路径(F01)。 -->
    <section class="contact-fallback" id="contact-fallback" aria-label="其他联系方式">
      <h2>其他联系方式</h2>
      <dl>
        <dt>邮箱</dt>
        <dd><a href="mailto:TODO-CONTACT-EMAIL">TODO-CONTACT-EMAIL</a></dd>
        <dt>微信</dt>
        <dd>TODO-CONTACT-WECHAT</dd>
        <dt>电话</dt>
        <dd><a href="tel:TODO-CONTACT-PHONE">TODO-CONTACT-PHONE</a></dd>
      </dl>
      <p class="fallback-hint">表单提交不成功时,请直接用以上任一方式联系我们。</p>
    </section>
  </section>

  <div class="glass contact-card" id="contact">
    <p class="sec-label">CONTACT · 留下联系方式</p>
    <h2 class="sec-title">合作 · 加入 · 咨询</h2>
    <p class="sec-sub">留下联系方式,我们会尽快回到你。</p>
    <form class="contact" id="leadForm" novalidate>
      <div class="field-cell full">
        <label class="field-label" for="lf-type">咨询类型</label>
        <select class="field" id="lf-type" name="type" required>
          <option value="">请选择</option>
          <option>合作咨询</option>
          <option>俱乐部合作</option>
          <option>商家合作</option>
          <option>其他咨询</option>
        </select>
        <p class="field-err" id="err-type"></p>
      </div>
      <div class="field-cell">
        <label class="field-label" for="lf-name">你的称呼 *</label>
        <input class="field" id="lf-name" name="name" required autocomplete="name" placeholder="如何称呼你" maxlength="40">
        <p class="field-err" id="err-name"></p>
      </div>
      <div class="field-cell">
        <label class="field-label" for="lf-contact">联系方式 *</label>
        <input class="field" id="lf-contact" name="contact" required placeholder="手机 / 微信 / 邮箱" maxlength="80">
        <p class="field-err" id="err-contact"></p>
      </div>
      <div class="field-cell full">
        <label class="field-label" for="lf-msg">需求说明</label>
        <textarea class="field" id="lf-msg" name="message" placeholder="想聊点什么?" maxlength="800"></textarea>
      </div>
      <label class="consent" for="lf-consent">
        <input type="checkbox" id="lf-consent" name="consent" required>
        <span>我已阅读并同意 <a href="/privacy.html">隐私政策</a>,允许城瘾使用我提供的信息与我联系。</span>
      </label>
      <button class="submit" type="submit">提交</button>
      <p class="form-status" id="lf-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</main>

<script type="module">
  // 真实旋转晨昏线地球(复用落地页 bloomEnvironment):自动旋转 + 晨昏线 + 云层 + 城市夜光 + 大气层
  import { gsap } from 'gsap';

  const canvas = document.getElementById('bloom');

  // F36:这颗地球的四张 NASA 贴图合计约 9.3MB,是本页最大的一笔开销,而本页唯一的业务
  // 目标是让人填完表单。它本来就有 .cosmos 渐变作为无 WebGL 时的降级方案,视觉上成立,
  // 所以在「不划算」的场景直接不加载 —— 省下的是整整 9.3MB,而不是压缩能省的那点。
  function shouldLoadEarth() {
    const conn = navigator.connection || {};
    if (conn.saveData) return false;                                   // 用户开了流量节省
    if (/^(slow-2g|2g|3g)$/.test(conn.effectiveType || '')) return false; // 慢网
    // 静止的地球等于一张 9.3MB 的静态装饰图,没有观感收益
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
    // 移动端:布局已收敛成单列,表单占满首屏,地球基本被内容盖住
    if (window.matchMedia('(max-width: 860px)').matches) return false;
    return true;
  }

  let env = null;
  const earthOn = shouldLoadEarth();

  // 装饰永远排在表单后面:等 load 之后的空闲时段再去取 bloomEnvironment 与那 9.3MB 贴图,
  // 首屏(load 时刻)的传输量里因此不含任何贴图。
  function startEarth() {
    import('./src/bloomEnvironment.js').then(({ setupBloomEnvironment }) => {
      env = setupBloomEnvironment(canvas) || null; // 无 WebGL 时静默返回,.cosmos 渐变兜底
      if (!env) { canvas.remove(); return; }
      env.resume(); // 启动绘制循环(落地页由 scheduler 触发,本页直接启动)
      // 晚到的地球淡进来,避免直接怼在 .cosmos 渐变上
      if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        gsap.to(canvas, { autoAlpha: 1, scale: 1, duration: 1.4, ease: 'power2.out' });
      } else {
        gsap.set(canvas, { autoAlpha: 1, scale: 1 });
      }
      // F36:标签页切到后台时停掉绘制循环(bloomEnvironment 早就提供了 pause,只是没人调)
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) env?.pause(); else env?.resume();
      });
    }).catch(() => canvas.remove());
  }

  if (earthOn) {
    gsap.set(canvas, { autoAlpha: 0, scale: 1.06, transformOrigin: '50% 55%' });
    const kick = () => (window.requestIdleCallback
      ? window.requestIdleCallback(startEarth, { timeout: 2000 })
      : setTimeout(startEarth, 200));
    if (document.readyState === 'complete') kick();
    else window.addEventListener('load', kick, { once: true });
  } else {
    canvas.remove(); // 不加载时把空 canvas 摘掉,避免它盖在 .cosmos 上
  }

  // 进场动画(gsap):hero 文案依次浮现;尊重 prefers-reduced-motion
  // (地球的淡入交给 startEarth,因为它比首屏晚到)
  // 逐条列出而不用 '.hero p':兜底联系方式(.contact-fallback)也在 .hero 里,
  // 它是表单失效时唯一的可触达路径,不该被入场动画挡住
  const heroBits = ['.hero .eyebrow', '.hero h1', '.contact-lead', '.contact-meta'];
  gsap.matchMedia().add({
    motion: '(prefers-reduced-motion: no-preference)',
    reduce: '(prefers-reduced-motion: reduce)'
  }, (ctx) => {
    if (ctx.conditions.reduce) {
      gsap.set(['.bloom-veil', ...heroBits], { autoAlpha: 1, clearProps: 'transform' });
      return;
    }
    gsap.set('.bloom-veil', { autoAlpha: 0 });
    gsap.set(heroBits, { autoAlpha: 0, y: 24 });
    gsap.timeline({ defaults: { ease: 'power3.out' } })
      .to('.bloom-veil', { autoAlpha: 1, duration: 1.2 }, 0.1)
      .to(heroBits, { autoAlpha: 1, y: 0, duration: 0.9, stagger: 0.12 }, 0.5);
  });
</script>
  <script type="module">
  // 联系表单:客户端校验 + 提交到留资 API(M6-08)
  (function(){
    var form=document.getElementById('leadForm'); if(!form) return;
    var status=document.getElementById('lf-status');
    var submitBtn=form.querySelector('.submit');
    // API base(F01):构建期由 VITE_LEADS_API_BASE 注入。本地 dev 未配置时沿用本地 Strapi;
    // 生产构建未配置时**不再**回落成空字符串——那会让 POST 变成同源请求,静态托管必然
    // 404/405,访客只看到「提交失败」。这里改成显式停用表单并指向静态兜底联系方式。
    var API_BASE=(import.meta.env.VITE_LEADS_API_BASE||'').trim()||
      (import.meta.env.DEV?'http://localhost:1337':'');
    if(!API_BASE){
      // 配置缺失必须被发现:控制台留一条明确的错误,页面上明确告知访客表单不可用
      console.error('[城瘾] 留资表单未配置 API 基地址:构建时缺少环境变量 VITE_LEADS_API_BASE,表单已停用。');
      form.classList.add('is-disabled');
      form.setAttribute('aria-disabled','true');
      Array.prototype.forEach.call(form.querySelectorAll('input,select,textarea,button'),function(el){ el.disabled=true; });
      status.className='form-status err';
      status.textContent='表单暂不可用,请用下面的联系方式直接联系我们。';
      return;
    }
    var TYPE_MAP={'合作咨询':'consult','俱乐部合作':'join','商家合作':'cooperation','其他咨询':'other'};
    var submitting=false, idemKey=null;

    function setErr(id,msg){
      var el=document.getElementById('lf-'+id), err=document.getElementById('err-'+id);
      if(el) el.classList.toggle('field--error',!!msg);
      if(err) err.textContent=msg||'';
    }
    function setStatus(cls,msg){ status.className='form-status'+(cls?' '+cls:''); status.textContent=msg; }
    function setBusy(b){ submitting=b; submitBtn.disabled=b; submitBtn.textContent=b?'提交中…':'提交'; }
    function rid(){ try{return crypto.randomUUID();}catch(e){return 'k'+Date.now()+Math.random().toString(36).slice(2);} }

    form.addEventListener('submit',function(e){
      e.preventDefault();
      if(submitting) return;
      setStatus('','');
      var typeLabel=document.getElementById('lf-type').value.trim();
      var name=document.getElementById('lf-name').value.trim();
      var contact=document.getElementById('lf-contact').value.trim();
      var message=document.getElementById('lf-msg').value.trim();
      var consent=document.getElementById('lf-consent').checked;
      var ok=true;
      setErr('type', typeLabel?'':'请选择咨询类型'); if(!typeLabel) ok=false;
      setErr('name', name?'':'请填写称呼'); if(!name) ok=false;
      setErr('contact', contact?'':'请填写联系方式'); if(!contact) ok=false;
      if(!consent){ ok=false; setStatus('err','请先阅读并同意隐私政策。'); }
      if(!ok){ if(consent) setStatus('err','请完善必填信息。'); return; }

      if(!idemKey) idemKey=rid(); // 同一次提交复用,防重复点击建多条
      var payload={
        type: TYPE_MAP[typeLabel]||'other',
        name: name, contact: contact, message: message,
        consent: true, sourcePage: location.pathname, idempotencyKey: idemKey
      };
      setBusy(true); setStatus('','正在提交…');
      fetch(API_BASE+'/api/public/v1/leads',{
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)
      }).then(function(res){
        return res.json().catch(function(){return {};}).then(function(body){return {status:res.status,body:body};});
      }).then(function(r){
        setBusy(false);
        if(r.status===201||r.status===200){
          var reqId=(r.body&&r.body.data&&r.body.data.requestId)||'';
          setStatus('ok','✓ 已收到你的信息,我们会尽快联系你。'+(reqId?'(受理号 '+reqId+')':''));
          form.reset(); idemKey=null;
        } else if(r.status===400){ setStatus('err','请检查填写信息是否完整有效。'); }
        else if(r.status===429){ setStatus('err','提交过于频繁,请稍后再试。'); }
        else { setStatus('err','提交失败,请稍后重试。'); }
      }).catch(function(){
        setBusy(false);
        setStatus('err','网络异常,提交未成功;你填写的内容已保留,请稍后重试。');
      });
    });
  })();
  </script>
  <script src="/site-shell.js" defer></script>
</body>
</html>
